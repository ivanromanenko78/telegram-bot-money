name: Build Battleship APK

on:
  push:
    branches:
      - apk-build-battleship-20261001

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate and install Android SDK
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk -type f -name sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMANAGER"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build unsigned release APK
        run: gradle :app:assembleRelease --stacktrace
      - name: Collect signing tool
        run: |
          cp /usr/local/lib/android/sdk/build-tools/35.0.0/lib/apksigner.jar ./apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: MorskoyBoy-release-unsigned
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            apksigner.jar
